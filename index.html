<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do box</title>
    <link rel="stylesheet" href="index.css" />
    
  </head>
  <button id="button" onclick="changeColor()">Шөнө/dark</button>
  <body>
    
    <div class="todo">
      <h1 id="textT">✨ Өнөөдрийн төлөвлөгөө</h1>
      <input id="taskInput" placeholder="Юу хийх вэ?" />
      <button id="add-button" onclick="addTask()">Нэмэх ➕</button>

      <ul id="taskList"></ul>
    </div>
   
   

    <script src="./index.js"></script>
  </body>
</html>
